name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Not requirements-serve.txt: torch + sentence-transformers are multi-GB and no unit
          # test loads a model (retrieval quality is measured by the pipeline workflow).
          pip install groq==0.37.1 numpy==2.4.6
          # Web app (scripts/api.py) and its tests: FastAPI and itsdangerous (signed session
          # cookie) are imported at module level; httpx backs FastAPI's TestClient.
          pip install fastapi==0.121.2 itsdangerous==2.2.0 httpx==0.28.1

      - name: Validate sources.yaml
        run: python -m crawler validate

      - name: Validate kb/ against taxonomy.yaml
        run: python scripts/validate_kb.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
