    reason: "Connection errors / timeouts on 2026-10-03: re-probe later (Startup Act, JORT legal texts)."

# Per-page overrides (optional). Pages listed here are always crawled.
pages:
  # OOUN Arabic page marks its sections with plain lines instead of headings.
  - site: ooun
    url: https://www.ooun.rnu.tn/web/ar/bourse.html
    split: titles
    titles:
      - إن كنت طالبًا جديدًا
      - منحة الطلبة القدامى (لأول مرة)
      - المنحة الجامعية للطلبة الأجانب
      - منح و قروض الماجستير
      - منح الدكتوراه
      - منح و قروض الطلبة أبناء رجال التعليم
      - منح أبناء العائلات التونسية المقيمة بالخارج
      - منحة التربص
  - site: jibaya
    url: https://jibaya.tn/blog/plateforme-dimmatriculation-fiscale-en-ligne/
    doc_type: procedure
  - site: jibaya
    url: https://jibaya.tn/wp-content/uploads/2026/07/Guide_utilisation_dexel.pdf
    doc_type: guide
  - site: erasmus_tn
    url: https://erasmusplus.tn/doc/E+International-Credit-Mobility.pdf
    doc_type: guide
  # Describes the 2 ways to register a new business at RNE (100% electronic with DIGIGO
  # signature, 50% fee discount, 24h processing -- vs. semi-electronic: online pre-filing
  # + an in-person visit to any RNE office, 48h processing). Found by manually navigating
  # rne_app's Angular menu (Formalités > Immatriculation Entreprise); the "Démarrer" button
  # past this point starts a real registration request, so we stopped there deliberately --
  # it needs a DIGIGO e-signature + live payment, not something to trigger while crawling.
  - site: rne_app
    url: https://www.registre-entreprises.tn/rne-public/#/demande-immatriculation-landing
    doc_type: procedure
  # Directory of CNSS's 49 regional/local offices by gouvernorat (which office covers
  # where) -- not matched by cnss's own keep[] pattern (that targets procedure content,
  # not this reference page), so pinned explicitly. No street address in the static HTML
  # (the per-office "carte" sub-page is JS-rendered), but "which office for which
  # gouvernorat" alone is a real improvement over nothing.
  - site: cnss
    url: https://www.cnss.tn/fr/notre_reseau/-/asset_publisher/8Nop/content/new-new-bureaux-regionaux
    doc_type: guide
