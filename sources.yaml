# ═══════════════════════════════════════════════════════════════════════════════════
# Khotwa source registry (v2): every source we use, and how to crawl it.
# ═══════════════════════════════════════════════════════════════════════════════════
# One entry per SITE (not per page). Adding a source = adding one block here.
#
#   status     active     crawled by `python -m crawler crawl`
#              candidate  evaluated, not crawled yet (see `note`)
#              excluded   never crawled (see `reason`)
#   trust      official (ministry, public agency) | institutional (university)
#              | program (official programme office)
#   domain     optional prior for the classifier (studies | employment)
#   render     auto (default: detected per page) | html | js | pdf
#   discover   how pages are found        -> crawler/discover.py
#   extract    how a page becomes Markdown -> crawler/extract.py
#   split      none | headings | accordion | titles   (one page -> several documents)
#   lang_variants  same page in several languages via URL rewriting -> crawler/registry.py
#   doc_types  [{match: regex on url+title, type: procedure|announcement|form|guide}]
#
# Check a new site before adding it:  python -m crawler probe <url>
# Check its discovery rules:          python -m crawler discover --site <key>
# Validate this file:                 python -m crawler validate
# ═══════════════════════════════════════════════════════════════════════════════════

version: 2

defaults:
  user_agent: "KhotwaBot/0.1 (academic MLOps project, TEK-UP University)"  # add a contact address before large runs
  delay_seconds: 2          # between two requests to the same host (sites run in parallel)
  timeout_seconds: 40
  respect_robots_txt: true
  min_words: 30             # shorter documents are skipped (menus, empty sections)

sites:

  # ───────────────────────── cross-domain national portals ─────────────────────────
  services_gov:
    status: active
    trust: official
    org: Portail national des services administratifs
    base_url: https://services.gov.tn
    # WordPress + Elementor: every service is an accordion item with fixed fields
    # (Service, Conditions, Documents demandés, Étapes, Délais, Lieu de dépôt...).
    discover:
      sitemap: true
      keep:
        - '/(je-poursuis-mes-etudes-a-luniversite|enseignement-superieur-et-recherche-scientifique(-2)?|je-cherche-un-emploi|emploi-et-formation|recrutement-et-formation-professionnelle|je-souhaite-beneficier-de-la-couverture-sociale|affaires-sociales(-2)?|affaires-etrangeres|finances(-2)?|impots-et-finances)/$'
    extract:
      content: ['div[data-elementor-type="wp-page"]']
    split: accordion
    doc_types: [{match: '.', type: procedure}]
    note: "Huge pages (~3 MB): the server sometimes truncates them, retries handle it."

  khadamet:
    status: active
    trust: official
    org: البوابة الوطنية للخدمات الإدارية
    base_url: https://khadamet.gov.tn
    discover:
      sitemap: true
      keep:
        - '/(أدرس-في-الجامعة|التعليم-العالي-والبحث-العلمي(-2)?|أبحث-عن-عمل|الشغل-والتكوين|التوظيف-والتكوين-المهني|أرغب-في-الحصول-على-التغطية-الاجتماعية|الشؤون-الاجتماعية(-2)?|الشؤون-الخارجية|المالية(-2)?|الضرائب-والمالية)/$'
    extract:
      content: ['div[data-elementor-type="wp-page"]']
    split: accordion
    doc_types: [{match: '.', type: procedure}]

  # ─────────────────────────────────── STUDIES ─────────────────────────────────────
  mes:
    status: active
    trust: official
    domain: studies
    org: Ministère de l'Enseignement Supérieur et de la Recherche Scientifique
    base_url: https://www.mes.tn
    discover:
      seeds: ["https://www.mes.tn/", "https://www.mes.tn/formulaire.php?code_menu=59"]
      # image.php?id=N looks like an image URL but actually serves PDF reports/white
      # papers (confirmed: Content-Type: application/pdf) -- the real substance behind
      # several thin page.php nav wrappers.
      follow: ['/page\.php\?code_menu=\d+', '/formulaire\.php\?code_menu=\d+', '/image\.php\?id=\d+']
      keep: ['/page\.php\?code_menu=\d+', '/formulaire\.php\?code_menu=\d+', '/image\.php\?id=\d+', '\.pdf$']
      max_depth: 1
      max_pages: 80
    extract:
      content: ["#imprim"]

  sicad:
    status: active
    trust: official
    org: Portail SICAD — Information et Communication Administrative (cross-ministère)
    base_url: http://www.sicad.gov.tn
    # No single domain: SICAD spans every ministry. Both the ?secteur=N sector filter
    # AND the ?page=N pagination LOOK like they work over plain GET (200 OK, plausible
    # result counts) but neither actually does anything -- confirmed with a clean 5-request
    # test (page=1 through page=5 in one run): byte-for-byte identical results every time.
    # Both are JS/AJAX-applied client-side; the site has no server-side pagination or
    # filtering reachable over plain HTTP. (An earlier attempt at this concluded pagination
    # DID work, based on an inconsistent one-off test -- that was wrong; don't trust it.)
    # So: one seed, whatever its default listing shows, classified like cnam.
    discover:
      seeds:
        - http://www.sicad.gov.tn/Fr/Prestations_57_3
      follow: ['Prestations_57_3_D\d+']
      keep: ['Prestations_57_3_D\d+']
      max_depth: 1
      max_pages: 100
    extract:
      content: ["div.div_padding_prestation"]
    note: "SICAD's full catalog is ~992 services, but only ~60 are reachable without automating the JS pagination/filter UI (clicking through, not just loading a URL) -- out of scope for now. Getting the rest would need Playwright driving actual clicks on the pagination controls and reading the AJAX-updated DOM between clicks, a real feature addition to render.py/discover.py, not a config change."

  annuaire_administration:
    status: active
    trust: official
    org: Portail du Gouvernement Tunisien — Annuaire d'administration
    base_url: http://fr.tunisie.gov.tn
    # Each organisation's headquarters address/phone/email, in one consistent format
    # across the whole government -- fills the "où s'adresser" gap that's missing from
    # almost every procedure page we have (confirmed: only 48% of affiliation-cnss docs,
    # 0% of equivalence docs mention a location). No single domain: covers organisations
    # from both Studies and Employment.
    discover:
      seeds:
        - http://fr.tunisie.gov.tn/annuaireAdministration/381/11-caisse-nationale-de-securite-sociale.htm
        - http://fr.tunisie.gov.tn/annuaireadministration/471/11-caisse-nationale-d-assurance-maladie.htm
        - http://fr.tunisie.gov.tn/annuaireAdministration/466/11-caisse-nationale-de-la-retraite-et-de-la-prevoyance-sociale.htm
        - http://fr.tunisie.gov.tn/annuaireAdministration/191/11-siege-du-ministere-de-l-enseignement-superieur-et-de-la-recherche-scientifique.htm
        - http://fr.tunisie.gov.tn/annuaireAdministration/190/11-siege-du-ministere-de-l-education.htm
    extract:
      content: ["div.paragraphe.tpl.TPL_ANNUAIRE_ADMINISTRATION"]
    min_words: 10   # these are address cards by design -- some (ministries) are just
                     # "Adresse/Email/Téléphone", legitimately under the site-wide 30-word
                     # default. A short real address is still exactly what we need here.
    note: "ANETI and RNE addresses found (19 rue Asdrubal, Tunis / Lac Toba, Les Berges du Lac) but no annuaireAdministration URL located for them yet -- their own sites' contact pages could be added later. Each seed is a single pinned headquarters page, not a crawl target: no follow/keep, so nothing else on fr.tunisie.gov.tn gets traversed."

  equivalence_rnu:
    status: active
    trust: official
    domain: studies
    org: Ministère de l'Enseignement Supérieur — Direction des équivalences
    base_url: https://equivalence.rnu.tn
    discover:
      seeds: [https://equivalence.rnu.tn/index_fr.html, https://equivalence.rnu.tn/index.html]
    extract:
      content: ["main#main", "main"]
    split: headings
    doc_types: [{match: '.', type: procedure}]
    min_words: 10   # the "Contactez-nous" section (address/tel/email of the Direction des
                     # équivalences -- exactly the "où on va" info) is only ~15 words and was
                     # being silently dropped by the default min_words:30 filter

  education_gov:
    status: active
    trust: official
    domain: studies
    org: Ministère de l'Éducation (via le portail SICAD)
    base_url: http://www.sicad.gov.tn
    # education.gov.tn itself is a WordPress news/press site with no procedure pages in its
    # own nav (checked by inspection); the actual procedures live on the government's
    # unified SICAD services portal. Each seed verified individually with `crawler probe`.
    discover:
      seeds:
        - http://www.sicad.gov.tn/Fr/Prestation_Obtention-dun-duplicata-du-diplome-ou-du--releve-des-notes_57_27_D2152
        - http://www.sicad.gov.tn/Fr/Prestations_57_3_D622
    extract:
      content: ["div.div_padding_prestation"]
    note: "K-12-level procedures (diploma/transcript duplicates, study-abroad fee transfers for students), distinct from MESRS/equivalence_rnu which only covers university-level equivalence. More SICAD pages (e.g. baccalaureate equivalence) may exist; add only after verifying each URL with `crawler probe`, not by guessing."

  transtu:
    status: active
    trust: official
    domain: studies
    org: Société des Transports de Tunis (TRANSTU)
    base_url: https://www.transtu.tn
    discover:
      seeds:
        - https://www.transtu.tn/
        # Official press releases: no price in euros/dinars anywhere on the site's own
        # HTML (checked the main tarif page, both subscription category pages, and this
        # press release itself -- confirmed exhaustively, the only place a number appears
        # is the Tarif.jpeg image), but these DO have real text content the thin pages
        # don't: exact sale dates, the 5 commercial agency addresses, and a linked PDF
        # with the full 151-office breakdown by gouvernorat.
        - https://www.transtu.tn/fr/espace-journalistes/0367-avis-aux-scolaires-premiere-tranche-de-la-campagne-de-vente-des-abonnements-scolaires-et-universitaires-2025-2026.html
      follow: ['/(abonnement|scolaire|etudiant|universitair)']
      keep: ['(abonnement|scolaire|etudiant|universitair)', '\.pdf$']
      max_depth: 2
      max_pages: 30
    extract:
      content: ["#content_transtu"]
      drop: ["#right_content", ".news", ".bar_social"]
    note: "Student transport subscription (metro/bus/TGM). The actual purchase happens on ichtirak.poste.tn (a transactional ASP.NET form, not informational content — deliberately NOT crawled). The price itself is genuinely only published as an image (Tarif.jpeg). Tesseract OCR was installed and tested on this image, but raw output was too garbled (dense bilingual Arabic/digit layout) to trust for automated parsing, so the full 6-column x 9-tier price grid for the 2024-2025 school year was transcribed manually (verified visually, not by OCR) directly into data/corpus/transtu/fr/0033-tarif-des-abonnements-scolaires-et-universitaires.html.fr.md. This manual addition is safe from being overwritten by future crawls: sync_state.json's stored hash for this doc still reflects the original (unedited) live-page extraction, so as long as TRANSTU's page HTML doesn't change, sync_doc will keep seeing 'unchanged' and will not touch the file. If TRANSTU ever changes this page (e.g. publishes next year's image under a new filename or adds real text), the hash will differ, the crawler will overwrite the file, and this manual table will need to be redone by hand against the new image."

  best_rnu:
    status: active
    trust: official
    domain: studies
    org: Ministère de l'Enseignement Supérieur — Bourses et prêts universitaires à l'étranger
    base_url: https://best.rnu.tn
    discover:
      sitemap: true
      # Nominative lists of students / results = personal data: never collected.
      # lightbox/shortcodes/blog-list-layout etc.: WordPress theme demo pages (Lorem
      # Ipsum placeholder content), not real site content.
      exclude: ['/(tag|category|author|feed|wp-json|comments)/', '/page/\d+',
                'liste|nominativ|retenus|resultat|admis',
                'lightbox|shortcode|blog-list-layout|portfolio-|gallery-demo']
      max_pages: 120
    extract:
      content: ["div.entry", "article"]
      drop: [".share-post"]

  ooun:
    status: active
    trust: official
    domain: studies
    org: Office des Œuvres Universitaires pour le Nord (OOUN)
    base_url: https://www.ooun.rnu.tn
    discover:
      seeds: [https://www.ooun.rnu.tn/web/fr/bourse.html, https://www.ooun.rnu.tn/web/ar/bourse.html]
    extract:
      content: ["div#content_section"]
    split: headings
    doc_types: [{match: '.', type: procedure}]
    note: "FR page still quotes the 2014 SMIG (3840 d); AR page quotes 6339,840 d. Contradiction kept as is."

  oouc:
    status: active
    trust: official
    domain: studies
    org: Office des Œuvres Universitaires pour le Centre (OOUC)
    base_url: https://www.oouc.rnu.tn
    discover:
      seeds: [https://www.oouc.rnu.tn/, https://www.oouc.rnu.tn/subventions-et-aide-sociale]
      # Without a `follow` pattern, nothing beyond the 2 seeds' own direct links was ever
      # explored (confirmed: announcement pages like mnh-aladmag-2023-2024 link to the real
      # hub page almnh-algamaay, but that link was never followed -- max_depth=1 stopped
      # one hop too early, and with no follow[] at all, depth-1 pages' own links were never
      # even looked at during discovery). Now follow blagh-* (announcements) one hop deeper
      # to reach the hub pages they point to.
      keep: ['/subventions-et-aide-sociale$', '/[^/]*(almnh|alkrod|mnh-|altrbs)[^/]*$']
      follow: ['/[^/]*(almnh|alkrod|mnh-|altrbs|blagh)[^/]*$']
      exclude: ['tlb-alaarod|tlb-aarod|tlb-trshhat|aaalan-tlb|sd-shghor|almhrgan|astbyan', 'ntyg|nata|kaem']
      max_depth: 2
      max_pages: 60
    extract:
      content: ["div.tab-content"]
    doc_types: [{match: '/(blagh|hol)-', type: announcement}]

  oous:
    status: active
    trust: official
    domain: studies
    org: Office des Œuvres Universitaires pour le Sud (OOUS)
    base_url: https://oous.rnu.tn
    discover:
      seeds:
        - https://oous.rnu.tn/ar/bourses-universitaires_2
        - https://oous.rnu.tn/ar/prets-universitaires
        - https://oous.rnu.tn/ar/documents-utiles_2
        - https://oous.rnu.tn/ar/actualites-principales?page=1&categories=22
      follow: ['/ar/actualites-principales\?page=\d+&categories=22']
      keep: ['/ar/(bourses-universitaires_2|prets-universitaires|documents-utiles_2)$', '/ar/actualites/\d+', '\.pdf$']
      exclude: ['change_lang']
      max_depth: 1
      max_pages: 50
    extract:
      content: ["#dynamicAccordion"]
    doc_types: [{match: '/actualites/', type: announcement}]

  erasmus_tn:
    status: active
    trust: program
    domain: studies
    org: Bureau National Erasmus+ Tunisie
    base_url: https://www.erasmusplus.tn
    discover:
      seeds:
        - https://www.erasmusplus.tn/Index-Etudiants.php
        - https://www.erasmusplus.tn/International-Credit-Mobility-(ICM).php
      keep: ['(Etudiant|Mobilit|ICM|Intra|programme)[^/]*\.php$', '/doc/[^/]+\.pdf$']
      max_depth: 1
      max_pages: 40
    extract:
      # Plain "article" also matches the site-wide footer's <article class="retrait1"> (the
      # contact address block) -- on pages whose real content is sparse, that footer block
      # outscores it on word count, so _pick_content() grabbed the SAME footer text on 5
      # different pages (confirmed: 5 distinct URLs sharing one content_hash, all just the
      # address/email/copyright footer, zero real page content). This selector fixes it when
      # tested directly against the saved raw HTML, but a --force re-crawl still produced the
      # same footer-only hash for those 5 pages -- root cause not fully tracked down (possibly
      # a fetch-cache path bypassing the fresh selector); the 5 duplicate docs were marked
      # status=removed by scripts/mark_nav_stubs.py instead of relying on this fix. Revisit if
      # erasmus_tn content quality matters more later.
      content: ["article:not(footer article)"]

  ucar:
    status: active
    trust: institutional
    domain: studies
    org: Université de Carthage
    base_url: https://www.ucar.rnu.tn
    discover:
      sitemap: true
      keep: ['(stage|pfe|attestation|releve|relevé|diplome|diplôme|certification|legalisation|inscription|mobilit|erasmus)']
      exclude: ['/(tag|category|author|feed)/', 'liste|nominativ|resultat|admis']
      max_pages: 60
    extract:
      # Elementor header/footer templates also carry data-elementor-type="wp-page"/"wp-post"
      # (same attribute as real content) but are nested inside wrapper divs; only the real
      # content is a direct child of <body>. Confirmed on both page- and post-template URLs.
      content: ['body > div[data-elementor-type="wp-page"]', 'body > div[data-elementor-type="wp-post"]']
    doc_types: [{match: 'call-for|scholarship|grant|appel', type: announcement}]
    note: "Fills the stages-pfe / releves-attestations gap (rules are set per university)."

  utm:
    status: active
    trust: institutional
    domain: studies
    org: Université de Tunis El Manar
    base_url: https://utm.rnu.tn
    render: js
    discover:
      seeds: [https://utm.rnu.tn/]
      keep: ['(stage|pfe|attestation|certification|diplome|inscription|mobilit)']
      max_depth: 1
      max_pages: 40
    note: "JavaScript site: activate after `pip install -r requirements-js.txt && playwright install chromium`."

  uma:
    status: active
    trust: institutional
    domain: studies
    org: Université de la Manouba
    base_url: https://www.uma.rnu.tn
    discover:
      sitemap: true
      keep: ['(stage|pfe|attestation|certification|diplome|inscription|mobilit)']
      max_pages: 40
    extract:
      content: ["section.page-body"]

  uvt:
    status: active
    trust: institutional
    domain: studies
    org: Université Virtuelle de Tunis
    base_url: https://www.uvt.rnu.tn
    # sitemap: the site's own Joomla xmap component returns 404 (broken on their end,
    # confirmed over both http and https) -- seeds + follow instead.
    discover:
      seeds:
        - https://www.uvt.rnu.tn/l-universite/documents-et-démarches
        - https://www.uvt.rnu.tn/etudiant/reinscription
        - https://www.uvt.rnu.tn/futur-etudiant/modalites-de-formation-et-examens
        - https://www.uvt.rnu.tn/etudiantetranger
        - https://www.uvt.rnu.tn/formations/frais-inscription-uvt
      follow: ['(stage|pfe|attestation|certification|diplome|inscription)']
      keep: ['(stage|pfe|attestation|certification|diplome|inscription)']
      max_depth: 1
      max_pages: 40

  usf:
    status: active
    trust: institutional
    domain: studies
    org: Université de Sfax
    base_url: https://www.usf.tn
    render: js
    discover:
      seeds: [https://www.usf.tn/]
      max_depth: 1
    note: "Blocks non-browser User-Agents with a ModSecurity 406 (confirmed: our honest KhotwaBot UA and even a bare 'Mozilla/5.0' both get rejected; only a full real-browser UA string gets through). Not spoofing a browser fingerprint just to get past their WAF -- that's circumventing their own security control, not a crawler bug. Separately, the one page that did load under a spoofed UA turned out to be a stale 2015 HTTrack mirror anyway, so there's nothing to gain here right now."

  orientation:
    status: candidate
    trust: official
    domain: studies
    org: Ministère de l'Enseignement Supérieur — Orientation universitaire
    base_url: https://www.orientation.tn
    discover:
      seeds: [https://www.orientation.tn/]
    note: "Mostly an application portal; procedures already described on services.gov.tn."

  # ───────────────────────────────── EMPLOYMENT ────────────────────────────────────
  cnss:
    status: active
    trust: official
    domain: employment
    org: Caisse Nationale de Sécurité Sociale (CNSS)
    base_url: https://www.cnss.tn
    discover:
      seeds:
        - https://www.cnss.tn/web/salarie/salaries
        - https://www.cnss.tn/web/employeur/employeurs
        - https://www.cnss.tn/web/non-salarie/nonsalaries
        - https://www.cnss.tn/web/non-salarie/non_sal_sous_secteur?categorie=1&secteur=1
        - https://www.cnss.tn/web/non-salarie/non_sal_sous_secteur?categorie=1&secteur=2
      follow: ['asset_publisher/\w+/content/(sal|emp|non_sal)', '_sous_secteur\?', '/web/(salarie|employeur|non-salarie)/\w+$']
      keep:
        - 'asset_publisher/\w+/content/(sal|emp|non_sal)\S*(immatriculation|affiliation|assiette|cotisation|remise_penalites|attestation|licenciement|avantage)'
        - 'document_library/get_file'
      # Out of scope (retirement, loans, death benefits, social actions): not even downloaded.
      exclude: ['nos_echos|notre_reseau|/langue|login|/inscription|recherche|faq|politique|plan_du_site',
                'pension|prets|indemnite|colonie|creche|handicap|reeduc|prestation|allocations_familiales']
      drop_query: ['asset_publisher/\w+/content/']
      max_depth: 3
      max_pages: 300
    # Language is kept in a session cookie unless the path is prefixed: fetch both.
    lang_variants:
      # Must also require /web/: a pinned page like .../notre_reseau/-/asset_publisher/8Nop/...
      # matches "asset_publisher" but has no /web/ segment, so the base/fr/ar substitutions
      # below were silent no-ops (regex didn't match -> returned the URL unchanged for both
      # "fr" and "ar"), fetching the SAME French URL twice under two different lang labels.
      # Confirmed on new-new-bureaux-regionaux: its .ar.md was 100% French text.
      only: '/web/.*asset_publisher'     # articles only: forms (document_library) have no language variant
      base: ['^(https://www\.cnss\.tn)/(?:fr/|ar/)?web/', '\1/web/']
      fr: ['^(https://www\.cnss\.tn)/web/', '\1/fr/web/']
      ar: ['^(https://www\.cnss\.tn)/web/', '\1/ar/web/']
    extract:
      # Plain "div.journal-content-article" also matches the sidebar widgets (Nos échos,
      # Notre réseau, Contactez nous...) which share the exact same class -- confirmed on
      # non_sal_secteur_ag1_cotisation: the "Nos échos" widget (7 links) outscored the real
      # short article on word count, so _pick_content() grabbed the wrong block entirely.
      # Scoping to the asset-publisher wrapper (only present around the real article) fixes it.
      content: ["div.asset-content .journal-content-article"]
      breadcrumb: ".breadcrumbs a"
      update_pattern: 'mise [àa] jour effectu\S* le (\d{2}/\d{2}/\d{4})'
    doc_types: [{match: 'document_library', type: form}, {match: 'asset_publisher', type: procedure}]
    note: "Mixed encodings in one page (UTF-8 menus, cp1252 articles): handled in crawler/http.py."

  emploi_gov:
    status: active
    trust: official
    domain: employment
    org: Ministère de l'Emploi et de la Formation Professionnelle
    base_url: https://www.emploi.gov.tn
    discover:
      seeds: [https://www.emploi.gov.tn/fr/123/equivalence-de-diplomes-etrangers, https://www.emploi.gov.tn/fr/131/emploi-des-etrangers-en-tunisie]
      rewrite: [['^http://', 'https://'], ['/index\.php/', '/']]
      follow: ['/fr/\d+/[\w-]+$']
      exclude: ['ministre|secretaire|organigramme|attributions|actualit|appel|annonce|contact|sondage|partenaire']
      max_depth: 2
      max_pages: 80
    extract:
      content: ["div#block-mfpe-content"]
    note: "/ar/node/<id> pages serve French text: no Arabic variant."

  jibaya:
    status: active
    trust: official
    domain: employment
    org: Administration fiscale — Ministère des Finances (DGI)
    base_url: https://jibaya.tn
    discover:
      # The blog mixes news and services: start from the services page instead of the sitemap.
      seeds: [https://jibaya.tn/services-en-ligne/]
      keep: ['/blog/', 'wp-content/uploads/.*[Gg]uide.*\.pdf$']
      exclude: ['/(tag|category|author|feed)/', '__trashed']
      max_depth: 1
      max_pages: 60
    extract:
      content: ['div#page > div[data-elementor-type="wp-post"]']

  rne:
    status: active
    trust: official
    domain: employment
    org: Registre National des Entreprises (RNE)
    base_url: https://www.registre-entreprises.tn
    render: pdf
    discover:
      seeds:
        - https://www.registre-entreprises.tn/rne-public/assets/pdfs/check-liste-creation/RNEC001_creationt_personne_physique_commer%C3%A7ant_FR.pdf
        - https://www.registre-entreprises.tn/rne-public/assets/pdfs/check-liste-creation/RNEC003_creation_personne_physique_metier_liberale_FR.pdf
    doc_types: [{match: '.', type: procedure}]
    note: "The site itself is an Angular app; its checklists are static PDFs. More checklists: activate `rne_app` (js)."

  rne_app:
    status: candidate
    trust: official
    domain: employment
    org: Registre National des Entreprises (RNE)
    base_url: https://www.registre-entreprises.tn
    render: js
    discover:
      seeds: [https://www.registre-entreprises.tn/rne-public/]
      keep: ['check-liste-creation/.*\.pdf$']
      max_depth: 1
    note: "Angular app with client-side hash routing (#/login etc.) -- confirmed even after full JS rendering, the checklist links only appear through actual in-app navigation clicks, not from the rendered DOM. Needs a scripted click-through (Playwright page.click on the real menu), not just render+scrape. rne (PDF, active) already covers the 2 main checklists directly."

  apii_portal:
    status: active
    trust: official
    domain: employment
    org: Agence de Promotion de l'Industrie et de l'Innovation (APII) — Portail de l'industrie
    base_url: https://www.tunisieindustrie.nat.tn
    discover:
      seeds:
        - https://www.tunisieindustrie.nat.tn/fr/doc.asp?mcat=16&mrub=182
        - https://www.tunisieindustrie.nat.tn/fr/doc.asp?mcat=16&mrub=186&msrub=268
        - https://www.tunisieindustrie.nat.tn/fr/download/CFGA/guide_.pdf
      follow: ['/fr/doc\.asp\?mcat=16']
      keep: ['/fr/doc\.asp\?mcat=16', '/download/CFGA/[^/]+\.pdf$']
      rewrite: [['&dev=true', '']]
      max_depth: 1
      max_pages: 60
    extract:
      content: ["div.espace-faq"]
    note: "Hosts the official 'Guide des procédures de création d'entreprises' (guide_.pdf,
      23963 words -- the real step-by-step APII/CFGA procedures: déclaration d'investissement,
      constitution juridique, entrée en activité, incitations financières). Its Arabic text
      is corrupted at extraction: specific letter pairs come out transposed (e.g. 'المؤسسات'
      extracts as 'املؤسسات' -- lam/meem swapped). Confirmed this is NOT a pdfplumber bug: tried
      PyMuPDF too, byte-identical corruption, same codepoints swapped -- the PDF's own font
      ToUnicode CMap has the ligature glyph for 'lam-meem' mapped in the wrong order, so every
      extraction library reads it the same wrong way. A real fix needs OCR on page renders
      (Tesseract is installed, but a quick test on a similar dense Arabic image upstream was
      itself fairly noisy -- 93 pages would be slow with uncertain quality), not attempted
      without sign-off. Not a blocker in practice: the actionable creation-entreprise content
      (documents/fees/deadlines, online registration process) is already covered cleanly via
      the rne site's 2 checklist PDFs and rne_app's pinned registration-process page, neither
      of which goes through this corrupted PDF."

  tia:
    status: active
    trust: official
    domain: employment
    org: Tunisia Investment Authority (TIA)
    base_url: https://tia.gov.tn
    discover:
      seeds:
        - https://tia.gov.tn/investor-guide/step-by-step-prcess/
        - https://tia.gov.tn/investor-guide/funding/
        - https://tia.gov.tn/investor-guide/legal-framewrok/
    extract:
      content: ['div[data-elementor-type="wp-page"]']
    note: "English only."

  social_gov:
    status: active
    trust: official
    domain: employment
    org: Ministère des Affaires Sociales
    base_url: https://www.social.gov.tn
    discover:
      sitemap: true
      keep: ['/(ar/)?(الشغل-والعلاقات-المهنية|documents)']
      max_pages: 60
    extract:
      content: ["div.field--name-body"]

  cnrps:
    status: active
    trust: official
    domain: employment
    org: Caisse Nationale de Retraite et de Prévoyance Sociale (CNRPS)
    base_url: https://www.cnrps.nat.tn
    # Real procedure pages use full descriptive French slugs, not keyword-coded URLs
    # (confirmed by inspection: homepage has 88 links, 0 matched a keyword keep[] pattern).
    discover:
      seeds:
        - https://www.cnrps.nat.tn/fr/vous-etes-affilie-en-activite-vous-devez-savoir-ce-qui-suit
        - https://www.cnrps.nat.tn/fr/ceci-vous-interesse
        - https://www.cnrps.nat.tn/fr/imprimes
    extract:
      content: ["div.field--name-body"]
    note: "Public-sector employees only; mostly pensions (out of scope). Relevant for attestations. Drupal 8 site: content selector is the standard Drupal body-field class."

  aneti:
    status: active
    trust: official
    domain: employment
    org: Agence Nationale pour l'Emploi et le Travail Indépendant (ANETI)
    base_url: https://www.emploi.nat.tn
    render: js   # confirmed: homepage has 0 links in raw HTML, 121 once rendered
    discover:
      # Follow every top-level nav tab (menu1=N / menu2=N, no trailing &page= so job-listing/
      # FAQ/sitemap sub-pages under a tab aren't swept in too -- "7855 Offres disponibles" alone
      # would otherwise explode into thousands of individual job postings). Anchored with '$'
      # so it never matches the honeypot (/blackhole/index.php has no menu1/menu2 param at all,
      # but kept it in `exclude` too as a second guard -- see CAUTION note below).
      seeds:
        - https://www.emploi.nat.tn/fo/Fr/global.php?menu1=160
      follow: ['\?menu[12]=\d+$']
      keep: ['\?menu[12]=\d+$']
      exclude: ['blackhole']
      max_depth: 1
      max_pages: 40
    note: "No extract.content override: this site's deeply nested table layout has no
      clean structural separation between navigation and content -- every selector tried
      either re-selects almost the whole page (bare 'td': the largest cell is always the
      outermost one, superset of all nested text) or silently drops pages whose real
      content cell itself contains a small internal formatting table ('td:not(:has(table))').
      Default whole-page extraction is used, plus extract.py's _strip_empty_table_rows() which
      collapses the empty pixel-spacing table cells this nested layout is full of -- the real
      text is now readable, not buried under hundreds of empty '| | | |' rows. Homepage is a
      JS shell (0 links in raw HTML); render:js fixes discovery, used for discovery traversal
      too (Discoverer gets a renderer whenever site.render=='js'), so follow[] actually works
      against the rendered DOM, not the empty static HTML. CAUTION: every page links to a
      honeypot trap (/blackhole/) labeled 'do not follow or you will be banned'. Confirmed the
      'menu1=\\d+$'/'menu2=\\d+$' follow pattern can't match it (no menu param at all), and
      excluded it explicitly as a second guard -- never traversed."

  cnam:
    status: active
    trust: official
    org: Caisse Nationale d'Assurance Maladie (CNAM)
    base_url: https://www.cnam.nat.tn
    # No single domain: affiliation via a CDI employer is employment, student insurance
    # is studies. Left unset so the classifier tags each document from its own content.
    discover:
      # Site uses short generic jsp names, not keyword-rich slugs (confirmed by inspection):
      # these ARE the content pages, not index pages to follow further.
      seeds:
        - https://www.cnam.nat.tn/ass_maladie.jsp
        - https://www.cnam.nat.tn/ass_sociale.jsp
        - https://www.cnam.nat.tn/atmp.jsp
        - https://www.cnam.nat.tn/tun_etranger.jsp
    extract:
      content: ["div.content"]
    note: "Full site is general healthcare administration (out of scope); only these 4 pages (health insurance, social coverage, work-accident insurance, Tunisians abroad) cover affiliation/coverage relevant to salaried and student status. Added after reconsidering: tied to CDI employment and student status, not purely health admin."

  autoentrepreneur:
