<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khotwa — Statistiques</title>
<style>
  :root {
    --bg: #f3f4f6; --panel: #ffffff; --panel-2: #fafafa; --border: #e5e7eb;
    --text: #1f2328; --muted: #6b7280; --accent: #2563eb;
    --good: #16a34a; --warn: #d97706; --bad: #dc2626;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
    --hero-2: #1f3a73; --hero-3: #b24a35;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --panel: #171a21; --panel-2: #1b1f27; --border: #272c35;
      --text: #e6e8eb; --muted: #8b949e; --accent: #3b82f6;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.5);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .mark { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--hero-2), var(--hero-3));
          display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
  header h1 { margin: 0; font-size: 19px; flex: 1; }
  header a { color: var(--accent); text-decoration: none; font-size: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
  .kpi .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .kpi .value { font-size: 26px; font-weight: 700; margin: 6px 0 2px; }
  .kpi .sub { font-size: 12.5px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-bottom: 12px; }
  h2 { font-size: 14px; margin: 0 0 12px; }
  .bar-row { display: grid; grid-template-columns: 130px 1fr 44px; align-items: center; gap: 10px; margin: 7px 0; font-size: 13px; }
  .bar { height: 9px; border-radius: 5px; background: var(--panel-2); overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 5px; background: var(--accent); }
  .bar-row .n { text-align: end; color: var(--muted); font-variant-numeric: tabular-nums; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { padding: 8px 0; border-top: 1px solid var(--border); font-size: 13.5px; }
  ul.list li:first-child { border-top: none; }
  ul.list .meta { color: var(--muted); font-size: 11.5px; }
  .empty { color: var(--muted); font-size: 13px; }
  .error { color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="mark">K</span>
    <h1>Statistiques d'utilisation</h1>
    <a href="/">&larr; Retour au chat</a>
  </header>
  <div id="content"><p class="empty">Chargement…</p></div>
</div>
<script>
(function () {
  var OUTCOMES = {
    answer: "Réponse sourcée", uncited: "Sans source (non trouvé)", no_match: "Hors sujet",
    clarification: "Clarification", chitchat: "Salutations", busy: "Limite Groq", empty: "Réponse vide", error: "Erreur"
  };
  var LANGS = { fr: "Français", ar: "Arabe", en: "Anglais" };

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function pct(x) { return x == null ? "—" : Math.round(x * 100) + " %"; }
  function secs(ms) { return ms == null ? "—" : (ms / 1000).toFixed(1) + " s"; }
  function when(ts) { try { return new Date(ts).toLocaleString("fr-FR"); } catch (e) { return ts; } }

  function bars(counts, labels) {
    var entries = Object.keys(counts).map(function (k) { return [k, counts[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
    if (!entries.length) return '<p class="empty">Aucune donnée pour l\'instant.</p>';
    var max = entries[0][1];
    return entries.map(function (e) {
      return '<div class="bar-row"><span>' + esc(labels[e[0]] || e[0]) + '</span><span class="bar"><span style="width:' +
        Math.max(3, Math.round(e[1] / max * 100)) + '%"></span></span><span class="n">' + e[1] + "</span></div>";
    }).join("");
  }
  function list(items, empty) {
    if (!items.length) return '<p class="empty">' + empty + "</p>";
    return '<ul class="list">' + items.map(function (i) {
      return '<li dir="auto">' + esc(i.question) + '<div class="meta">' + esc(when(i.ts)) + (i.lang ? " · " + esc(LANGS[i.lang] || i.lang) : "") + "</div></li>";
    }).join("") + "</ul>";
  }
  function flagged(items) {
    if (!items.length) return '<p class="empty">Aucune — chaque chiffre et lien cité figure dans les sources.</p>';
    return '<ul class="list">' + items.map(function (i) {
      return '<li dir="auto">' + esc(i.question) + '<div class="meta">' + esc(when(i.ts)) + " · absent des sources : " + esc(i.unsupported.join(", ")) + "</div></li>";
    }).join("") + "</ul>";
  }
  function kpi(label, value, sub) {
    return '<div class="card kpi"><div class="label">' + label + '</div><div class="value">' + value + '</div><div class="sub">' + sub + "</div></div>";
  }

  fetch("/metrics").then(function (r) {
    if (r.status === 401) { location.href = "/"; return null; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function (m) {
    if (!m) return;
    var fb = m.feedback;
    document.getElementById("content").innerHTML =
      '<div class="kpis">' +
        kpi("Questions", m.questions, "dont " + (m.by_outcome.chitchat || 0) + " salutations, exclues des taux ci-contre") +
        kpi("Taux de réponse", pct(m.answer_rate), "réponses citant une source officielle") +
        kpi("Sans réponse", pct(m.unanswered_rate), "hors sujet ou non trouvé dans les sources") +
        kpi("Latence", secs(m.latency_ms.p50), "médiane · p95 " + secs(m.latency_ms.p95)) +
        kpi("Satisfaction", pct(fb.satisfaction), fb.up + " utiles · " + fb.down + " pas utiles") +
        kpi("Erreurs", pct(m.error_rate), "erreurs serveur, limites Groq, réponses vides") +
        kpi("Non vérifiées", pct(m.grounding.flagged_rate), m.grounding.flagged + " / " + m.grounding.checked + " réponses citent un chiffre, lien ou renvoi absent des sources") +
      "</div>" +
      '<div class="grid2">' +
        '<div class="card"><h2>Résultat des questions</h2>' + bars(m.by_outcome, OUTCOMES) + "</div>" +
        '<div class="card"><h2>Langue des questions</h2>' + bars(m.by_language, LANGS) + "</div>" +
      "</div>" +
      '<div class="grid2">' +
        '<div class="card"><h2>Questions récentes sans réponse</h2>' + list(m.recent_unanswered, "Aucune — toutes les questions ont trouvé une source.") + "</div>" +
        '<div class="card"><h2>Réponses jugées pas utiles</h2>' + list(m.recent_downvoted, "Aucun avis négatif.") + "</div>" +
      "</div>" +
      '<div class="card"><h2>Réponses non vérifiées (élément absent des sources)</h2>' + flagged(m.recent_flagged) + "</div>";
  }).catch(function (e) {
    document.getElementById("content").innerHTML = '<p class="error">Impossible de charger les statistiques (' + esc(e.message) + ").</p>";
  });
})();
</script>
</body>
</html>
